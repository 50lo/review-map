[package]
name = "reviewmap-app"
description = "Review Map: a structural review of a code change, as a desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "reviewmap_app"
path = "src/lib.rs"

[[bin]]
name = "reviewmap-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
reviewmap-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
