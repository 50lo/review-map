name: CI

on:
  pull_request:
  push:
    branches: [main]

# New pushes replace older runs on the same PR or branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The Kotlin grammar repository is large; cache SwiftPM's clones so only dependency changes refetch it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ hashFiles('Package.resolved') }}
      # IndexStoreDB's C++ needs the toolchain's dispatch and Block headers, which aren't on the default include path on Linux.
      # These synthetic fixtures need only Swift and git. Run the full suite locally with `swift test`.
      - name: Build and smoke test
        run: swift test -Xcxx -I/usr/lib/swift -Xcxx -I/usr/lib/swift/Block --filter 'FixtureTests/testSnapshot|KotlinTests/testFixture'

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Language smoke tests
        run: npm test -- src/language-table.test.ts src/languages.test.ts
