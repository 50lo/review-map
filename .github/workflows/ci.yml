name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # TypeScript index mode runs scip-typescript through npx.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # IndexStoreDB's C++ needs the toolchain's dispatch and Block headers, which aren't on the default include path on Linux.
      - name: Build
        run: swift build -Xcxx -I/usr/lib/swift -Xcxx -I/usr/lib/swift/Block
      - name: Test
        run: swift test -Xcxx -I/usr/lib/swift -Xcxx -I/usr/lib/swift/Block

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Test
        run: npm test
