[package]
name = "reviewmap-core"
description = "Review Map's analyzer: repository access, parsing, Bazel workspaces, indexing, and the change report."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
gix = { version = "0.90", default-features = false, features = ["revision", "sha1", "parallel"] }
libc = "0.2"
plist = "1"
rayon = "1"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "d6af96d2e23ef0a8ff5ab512864378cf08fba311" }

[dev-dependencies]
tempfile = "3"
